[package]
name = "pb-decode"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Image-decode abstraction for PhotoBlaze: decode-to-fit + preview-first, with swappable backends."

# Phase 2: zune-jpeg (pure Rust, no NASM/cmake) is the first real backend behind
# the ImageDecoder seam; kamadak-exif reads orientation so photos display upright.
# turbojpeg/dav1d/libheif/etc. slot in behind the same trait later.
[dependencies]
zune-jpeg = "0.4"
kamadak-exif = "0.6"
# Decode-to-fit: high-quality SIMD downscale to the display size, so large photos
# aren't minified (grainy/aliased) on the GPU. (zune-jpeg has no scaled decode.)
fast_image_resize = "5"
# `jpeg` here is for ENCODING only (`encode_jpeg_rgba8`, the AI-describe image prep, task
# #44) — decoding still routes through zune-jpeg via the ImageDecoder seam.
image = { version = "0.25.10", default-features = false, features = ["png", "gif", "bmp", "ico", "tiff", "webp", "tga", "qoi", "pnm", "hdr", "exr", "ff", "dds", "jpeg"] }
jxl-oxide = "0.12.6"
# ICC color management: parse the source profile to a 3x3 (source primaries ->
# sRGB) + transfer curve, applied in-shader by pb-render. Pure Rust; already in
# the tree transitively via `image`. Only the parse/matrix/TRC API is used here.
moxcms = "0.8"
# f32 -> f16 packing for HDR (WIC scRGB-linear) buffers handed to the GPU as
# Rgba16Float. Already in the tree transitively.
half = "2"
# Reinterpret f32 pixel buffers as bytes for the f32 resize path. In-tree already.
bytemuck = "1"
resvg = { version = "0.47.0", default-features = false }
flate2 = "1"
imagepipe = "0.5.0"
rawloader = "0.37.1"
# Live Photo motion + audio decode on Linux (task: Linux Live Photo). Optional: links
# system FFmpeg (libavcodec/format/swscale/swresample) via `--features livephoto`, so the
# pure-Rust core has zero native build risk without it (ADR-015). Windows uses Media
# Foundation, macOS AVFoundation — this backend is the Linux mirror behind the same seam.
ffmpeg-next = { version = "8.1", default-features = false, features = ["codec", "format", "software-scaling"], optional = true }
# Photoshop .psd is decoded in-crate (`src/psd.rs`): the merged composite in the
# final image-data section is a small, well-specified format (planar channels, raw
# or PackBits/RLE), and both `psd` (panicked on real files) and `zune-psd` (no
# 16-bit RLE) had gaps. No extra dependency.

[features]
# CPU HEVC decode via libheif (libde265), behind the ImageDecoder seam. OFF by
# default: it links a native C lib (see build.rs), so a missing/broken C toolchain
# must never block the pure-Rust core (ADR-015). Enable with `--features libheif`.
# Two roles by platform:
#   * Windows — an A/B accelerator over WIC. WIC's HEVC decoder serializes
#     (~1.6-2.4x across 8 threads, measured); libheif is plain CPU so the pool's
#     workers scale ~linearly. Links a vcpkg static `libheif[core]:x64-windows-
#     static-md` (scripts/setup-libheif.ps1).
#   * Linux — the *only* HEIC path (there's no WIC). Links the system shared lib
#     (`apt install libheif-dev`); libde265 loads as a runtime plugin.
# build.rs sets the `heic_libheif` cfg the backend gates on. macOS uses Image I/O,
# so it ignores this feature.
libheif = []
# Linux Live Photo motion + audio via FFmpeg (`ff_live.rs`). Off by default: links system
# FFmpeg (native C), so it must never block the pure-Rust core (ADR-015). Only meaningful on
# Linux/BSD — Windows (Media Foundation) and macOS (AVFoundation) have their own backends and
# ignore it. `apt install libavcodec-dev libavformat-dev libswscale-dev libswresample-dev clang`.
livephoto = ["dep:ffmpeg-next"]
# Animated AVIF (avis) playback on Windows via a vcpkg static dav1d (task #76). OFF by
# default: links a native C lib (ADR-015). build.rs sets the `av1_dav1d` cfg the backend
# gates on and compiles the C accessor shim (csrc/dav1d_shim.c) against the pinned vcpkg
# headers. A harmless no-op on non-Windows targets (macOS = Image I/O, Linux = FFmpeg).
dav1d = []
# Hidden: exposes the pure-Rust avis demuxer to the cargo-fuzz harness (fuzz/).
# Never enable in a real build.
fuzz-internals = []

[build-dependencies]
# Compiles the dav1d shim when `--features dav1d` targets Windows. Unconditional: build
# scripts can't cfg-gate on features (they only see CARGO_FEATURE_* env vars at run
# time), so an optional `cc` would break every feature-off build of build.rs itself.
cc = "1"

[dev-dependencies]

# Throwaway HEIC A/B tools. `heic_compare` calls the feature-gated LibHeifDecoder
# directly, so it only builds with `--features libheif` (keeps `--all-targets`
# green without the feature). `heic_bench` uses only public types, so it always
# builds (it just routes through WIC unless the feature is on).
[[example]]
name = "heic_compare"
required-features = ["libheif"]

[target."cfg(windows)".dependencies]
# AVIF + HEIC via the Windows Imaging Component (the OS codec extensions), and the
# Live Photo motion .mov via Media Foundation (task #39, same OS-codec pattern);
# pure-Rust bindings, no native build. cfg-gated off on non-Windows targets.
windows = { version = "0.62.2", features = ["Win32_Graphics_Imaging", "Win32_System_Com", "Win32_Foundation", "Win32_Media_MediaFoundation"] }
