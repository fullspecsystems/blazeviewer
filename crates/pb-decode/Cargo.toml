[package]
name = "pb-decode"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Image-decode abstraction for PhotoBlaze: decode-to-fit + preview-first, with swappable backends."

# Phase 2: zune-jpeg (pure Rust, no NASM/cmake) is the first real backend behind
# the ImageDecoder seam; kamadak-exif reads orientation so photos display upright.
# turbojpeg/dav1d/libheif/etc. slot in behind the same trait later.
[dependencies]
zune-jpeg = "0.4"
kamadak-exif = "0.6"
# Decode-to-fit: high-quality SIMD downscale to the display size, so large photos
# aren't minified (grainy/aliased) on the GPU. (zune-jpeg has no scaled decode.)
fast_image_resize = "5"
# `jpeg` here is for ENCODING only (`encode_jpeg_rgba8`, the AI-describe image prep, task
# #44) — decoding still routes through zune-jpeg via the ImageDecoder seam.
image = { version = "0.25.10", default-features = false, features = ["png", "gif", "bmp", "ico", "tiff", "webp", "tga", "qoi", "pnm", "hdr", "exr", "ff", "dds", "jpeg"] }
jxl-oxide = "0.12.6"
# ICC color management: parse the source profile to a 3x3 (source primaries ->
# sRGB) + transfer curve, applied in-shader by pb-render. Pure Rust; already in
# the tree transitively via `image`. Only the parse/matrix/TRC API is used here.
moxcms = "0.8"
# f32 -> f16 packing for HDR (WIC scRGB-linear) buffers handed to the GPU as
# Rgba16Float. Already in the tree transitively.
half = "2"
# Reinterpret f32 pixel buffers as bytes for the f32 resize path. In-tree already.
bytemuck = "1"
resvg = { version = "0.47.0", default-features = false }
flate2 = "1"
imagepipe = "0.5.0"
rawloader = "0.37.1"
# FFmpeg (libavcodec/format/swscale/swresample), shared by two features (task #84 plan):
# `livephoto` (Linux Live Photo / animated-HEIF motion) and `ffvideo` (the cross-platform
# streaming video producer/poster: Linux playback + the macOS MKV/WebM/VP8/VP9 fallback).
# Optional so the pure-Rust core has zero native build risk without it (ADR-015).
# `software-resampling` pulls libswresample for the ffvideo audio decoder (plan §7).
# (NOT `resampling` — that one maps to the long-removed libavresample.)
ffmpeg-next = { version = "8.1", default-features = false, features = ["codec", "format", "software-scaling", "software-resampling"], optional = true }
# Photoshop .psd is decoded in-crate (`src/psd.rs`): the merged composite in the
# final image-data section is a small, well-specified format (planar channels, raw
# or PackBits/RLE), and both `psd` (panicked on real files) and `zune-psd` (no
# 16-bit RLE) had gaps. No extra dependency.

[features]
# CPU HEVC decode via libheif (libde265), behind the ImageDecoder seam. OFF by
# default: it links a native C lib (see build.rs), so a missing/broken C toolchain
# must never block the pure-Rust core (ADR-015). Enable with `--features libheif`.
# Two roles by platform:
#   * Windows — an A/B accelerator over WIC. WIC's HEVC decoder serializes
#     (~1.6-2.4x across 8 threads, measured); libheif is plain CPU so the pool's
#     workers scale ~linearly. Links a vcpkg static `libheif[core]:x64-windows-
#     static-md` (scripts/setup-libheif.ps1).
#   * Linux — the *only* HEIC path (there's no WIC). Links the system shared lib
#     (`apt install libheif-dev`); libde265 loads as a runtime plugin.
# build.rs sets the `heic_libheif` cfg the backend gates on. macOS uses Image I/O,
# so it ignores this feature.
libheif = []
# Internal: the FFmpeg dep + the shared `ffmpeg/` helper modules (init, custom AVIO,
# probe, color). Not meant to be enabled directly — `livephoto` and `ffvideo` both pull
# it. Links system FFmpeg (native C), so it must never block the pure-Rust core (ADR-015).
# `apt install libavcodec-dev libavformat-dev libswscale-dev libswresample-dev clang`.
ffmpeg = ["dep:ffmpeg-next"]
# Linux Live Photo motion + audio via FFmpeg (`ff_live.rs`). Off by default. Only meaningful
# on Linux/BSD — Windows (Media Foundation) and macOS (AVFoundation) have their own backends
# and ignore it.
livephoto = ["ffmpeg"]
# FFmpeg **container reading without decoding** (task #100): the `ffmpeg/details.rs`
# probes + the `ffmpeg/tracks.rs` catalog, and none of the producer/poster decode path.
#
# This exists for Windows, and only because Media Foundation genuinely cannot see
# subtitle tracks: a source's presentation descriptor — its own complete stream table,
# not a reader-side filter — reports 3 streams for a multitrack.mkv holding 1 video +
# 2 audio + 4 subtitle tracks. MF keeps poster + playback (hardware decode, low
# latency); FFmpeg only reads the track table. Measured cost: +3.06 MB with the
# demuxers-only vcpkg build (31.98 -> 35.04 MB release exe; vs +16.42 MB untrimmed).
#
# Implied by `ffvideo`, which needs the same probes and adds decoding on top.
ffprobe = ["ffmpeg"]
# Cross-platform streaming video via FFmpeg (task #84): the `VideoProducerEvent`/`Msg`
# producer + poster for the containers/codecs the OS backends can't handle — ALL
# video on Linux (which has no OS backend), MKV/WebM/VP8/VP9/AV1 fallback on macOS.
# Off by default (ADR-015). Windows takes only `ffprobe` (Media Foundation decodes).
ffvideo = ["ffmpeg", "ffprobe"]
# Animated AVIF (avis) playback on Windows via a vcpkg static dav1d (task #76). OFF by
# default: links a native C lib (ADR-015). build.rs sets the `av1_dav1d` cfg the backend
# gates on and compiles the C accessor shim (csrc/dav1d_shim.c) against the pinned vcpkg
# headers. A harmless no-op on non-Windows targets (macOS = Image I/O, Linux = FFmpeg).
dav1d = []
# Hidden: exposes the pure-Rust avis demuxer to the cargo-fuzz harness (fuzz/).
# Never enable in a real build.
fuzz-internals = []

[build-dependencies]
# Compiles the dav1d shim when `--features dav1d` targets Windows. Unconditional: build
# scripts can't cfg-gate on features (they only see CARGO_FEATURE_* env vars at run
# time), so an optional `cc` would break every feature-off build of build.rs itself.
cc = "1"

[dev-dependencies]

# Throwaway HEIC A/B tools. `heic_compare` calls the feature-gated LibHeifDecoder
# directly, so it only builds with `--features libheif` (keeps `--all-targets`
# green without the feature). `heic_bench` uses only public types, so it always
# builds (it just routes through WIC unless the feature is on).
[[example]]
name = "heic_compare"
required-features = ["libheif"]

[target."cfg(windows)".dependencies]
# AVIF + HEIC via the Windows Imaging Component (the OS codec extensions), and the
# Live Photo motion .mov via Media Foundation (task #39, same OS-codec pattern);
# pure-Rust bindings, no native build. cfg-gated off on non-Windows targets.
# Win32_System_Com_StructuredStorage + Win32_System_Variant: PROPVARIANT for the Source
# Reader's duration attribute + SetCurrentPosition (video seek — task #79 spike, then the
# real producer; the reader's seek/attribute methods are cfg-gated on BOTH features).
# Win32_Graphics_Direct3D + Direct3D11: the IMFDXGIDeviceManager for MF hardware video
# decode (task 79.10 — the copybench spike, then the production producer).
windows = { version = "0.62.2", features = ["Win32_Graphics_Imaging", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Foundation", "Win32_Media_MediaFoundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi"] }
# The `#[implement]` COM machinery for the in-RAM read-only IStream (`mf_stream.rs`)
# that feeds archived videos to Media Foundation without a file ever touching disk.
windows-core = "0.62"
# Windows links FFmpeg from the **pinned vcpkg tree** (`setup-libheif.ps1`), the same way
# libheif + dav1d do — task #100. This entry unions onto the base `ffmpeg-next` dep above
# and exists solely to add `static`, which must NOT be set on Linux/macOS (they link the
# system's shared FFmpeg via pkg-config).
#
# Why `static` is load-bearing here: `ffmpeg-sys-next`'s build.rs reads
# `CARGO_FEATURE_STATIC`, and when it is *absent* it sets `VCPKGRS_DYNAMIC=1` — which
# makes the `vcpkg` crate resolve the **dynamic** `x64-windows` triplet instead of the
# `x64-windows-static-md` one this project pins, and the lookup fails. With `static` on,
# the vcpkg crate's default triplet is already `x64-windows-static-md` (and
# `arm64-windows-static-md` on ARM64), so no `VCPKGRS_TRIPLET` is needed.
#
# ⚠ Requires `VCPKG_ROOT` in the build environment: unlike our own `build.rs`, the `vcpkg`
# crate has no `~/vcpkg` fallback.
ffmpeg-next = { version = "8.1", default-features = false, features = ["static"], optional = true }
