[package]
name = "pb-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors = ["JD Lien <jd@jdlien.com>"]
description = "PhotoBlaze binary: the winit window + event loop wiring core, decode, and render together."

[[bin]]
name = "photoblaze"
path = "src/main.rs"

[features]
# Pass-through: build with `--features libheif` to route full SDR HEIC decodes
# through the parallel CPU libheif backend (links the vcpkg static libs; see
# pb-decode/build.rs). Off by default so the stock build is pure-Rust + WIC.
libheif = ["pb-decode/libheif"]

[dependencies]
pb-core = { workspace = true }
pb-decode = { workspace = true }
pb-source = { workspace = true }
pb-render = { workspace = true }
winit = "0.30"
# Rasterizes the info-panel text using the OS UI font (loaded at runtime).
fontdue = "0.9"
# Native file/folder picker (Open dialog); uses the OS dialog on Windows. Default
# features pull the Linux xdg-portal/zbus backend we don't need, so disable them —
# the Windows (and later macOS) native backend is always compiled.
rfd = { version = "0.14", default-features = false }
# Native OS menu bar (real Windows HMENU now, NSMenu on macOS later from the same
# API). Shown in windowed mode only — fullscreen stays chrome-free. OS-drawn, so
# it's perf-neutral. On Linux it would need the optional `gtk` feature (off here).
muda = "0.19"
# egui for our own dialog windows (Settings, About): a second winit window with an
# egui-wgpu surface. egui 0.29 matches wgpu 22 + winit 0.30. Only runs while a
# dialog is open (off the photo hot path); follows the OS dark/light theme.
egui = "0.29"
egui-wgpu = "0.29"
# Default features give clipboard + `links` (so the About hyperlink opens a browser);
# the Linux wayland/x11 backends are cfg-gated out on Windows.
egui-winit = "0.29"
# Block on wgpu adapter/device init for the dialog window's own GPU surface.
pollster = "0.3"
# Pack/unpack the f16 (Rgba16Float) HDR decode buffer when converting to 8-bit for
# the clipboard. Matches the version pb-decode already resolves.
half = "2"
# Rasterize the vendored Font Awesome duotone SVG icons for the HUD/toast overlays
# (re-exports usvg + tiny_skia). Same version + default-features-off as pb-decode's
# SVG backend, so it's already in the lockfile. Runs only when an overlay is rebuilt
# (off the photo hot path).
resvg = { version = "0.47", default-features = false }
# Lossless EXIF write for Save Rotation (Ctrl+S): rewrites only the Orientation tag,
# leaving the compressed JPEG scan untouched (the crate has no image codec, so it
# physically can't re-encode pixels — it only rewrites metadata segments).
little_exif = "0.6"
# Send a deleted photo to the OS Recycle Bin / Trash (Del). Uses IFileOperation on
# Windows; cross-platform for the later macOS port. `default-features = false` drops
# the Linux DBus/KDE backends + `chrono` (only needed for the deferred undo/list).
# `coinit_apartmentthreaded`: trash requires a COM-init mode on Windows, and winit's
# main thread is STA (it uses OLE drag-drop), so apartment-threaded matches.
trash = { version = "5", default-features = false, features = [
    "coinit_apartmentthreaded",
] }

# Win32 for: pointing the window icon at the exe's multi-size .ico (crisp small
# title-bar icon, vs winit downscaling one big image), and the native menu later.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    # uxtheme.dll dark-mode exports (resolved by ordinal) for the native menu.
    "Win32_System_LibraryLoader",
    # TaskDialog (the native "About" dialog).
    "Win32_UI_Controls",
    # Clipboard copy (Ctrl+C): open/empty/set, HGLOBAL alloc, CF_DIBV5/CF_HDROP,
    # BITMAPV5HEADER. CF_* live under System_Ole; the bitmap header under Graphics_Gdi.
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_Graphics_Gdi",
] }

# Test-only: build a ZIP fixture for the no-trace integration test. Same lean
# pure-Rust feature set pb-source uses; the writer comes with the base crate.
[dev-dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }

# Embeds the .exe icon + version metadata on Windows (build.rs). Best-effort: if
# the resource compiler is absent the build still succeeds (see build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# WiX/MSI packaging (cargo-wix). The installer source lives at wix/main.wxs and
# registers PhotoBlaze as an "Open with" candidate + a folder right-click verb.
# No EULA dialog (skip the license-agreement screen).
[package.metadata.wix]
eula = false
name = "PhotoBlaze"
product-name = "PhotoBlaze"
