[package]
name = "pb-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "PhotoBlaze binary: the winit window + event loop wiring core, decode, and render together."

[[bin]]
name = "photoblaze"
path = "src/main.rs"

[dependencies]
pb-core = { workspace = true }
pb-decode = { workspace = true }
pb-render = { workspace = true }
winit = "0.30"
# Rasterizes the info-panel text using the OS UI font (loaded at runtime).
fontdue = "0.9"
