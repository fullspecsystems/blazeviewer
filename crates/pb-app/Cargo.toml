[package]
name = "pb-app"
version = "0.2.1"
edition.workspace = true
license.workspace = true
authors = ["JD Lien <jd@jdlien.com>"]
description = "PhotoBlaze binary: the winit window + event loop wiring core, decode, and render together."

[[bin]]
name = "blazeviewer"
path = "src/main.rs"

[features]
# Pass-through: build with `--features libheif` to route full SDR HEIC decodes
# through the parallel CPU libheif backend (links the vcpkg static libs; see
# pb-decode/build.rs). Off by default so the stock build is pure-Rust + WIC.
libheif = ["pb-decode/libheif"]
# Pass-through: animated AVIF (avis) playback via the vcpkg static dav1d (task #76).
# Windows-only in effect; off by default so the stock build stays pure-Rust + WIC.
dav1d = ["pb-decode/dav1d"]
# Linux Live Photo support: the FFmpeg motion decoder (pb-decode/pb-app-core) plus the
# audio-output backend in `live_audio.rs`, which pipes the decoded PCM to PipeWire's
# `pw-cat`. Off by default; Linux-only in effect (Windows/macOS have native backends).
# Needs system FFmpeg; audio needs `pw-cat` (from pipewire) on PATH at runtime.
livephoto = ["pb-app-core/livephoto", "pb-decode/livephoto", "dep:libc"]
# Cross-platform FFmpeg video (task #84): Linux video playback + posters through
# pb-decode's FFmpeg producer behind the shared VideoSession. Off by default (links
# system FFmpeg); Linux-only in effect for this winit shell (Windows uses Media
# Foundation). NOT in the Linux ship feature set until plan phases 5–6 pass
# (ship-gating by discipline, plan §13).
# dep:libc = the pw-cat SIGSTOP/SIGCONT pause control in video_audio.rs (Linux).
# Pass-through: FFmpeg container reading without decoding (task #100). This IS in the
# Windows ship feature set — it is the only way the Details tab can list subtitle
# tracks, which Media Foundation cannot enumerate. Costs +3.06 MB with the
# demuxers-only vcpkg build (scripts/setup-libheif.ps1).
ffprobe = ["pb-app-core/ffprobe", "pb-decode/ffprobe"]
ffvideo = ["pb-app-core/ffvideo", "pb-decode/ffvideo", "ffprobe", "dep:libc"]

[dependencies]
# Platform-neutral orchestration model (actions, key model, keymap) — shared with
# the future macOS native shell; this binary is the winit shell over it (NS0).
pb-app-core = { workspace = true }
pb-core = { workspace = true }
pb-decode = { workspace = true }
pb-source = { workspace = true }
pb-render = { workspace = true }
# The HUD CPU compositor (info panel / toasts / pie / chip + FA icons), split out of
# this shell in NS0 so the orchestration core can own the render path (ADR-021).
pb-hud = { workspace = true }
# The design-system crate (tokens + components) backing our egui dialogs.
pb-ui = { workspace = true }
# The CLI parser (task #78): clap Cli → pb_app_core::LaunchOverrides. A shared lib crate so
# the macOS FFI host can link the same parser later; re-exports clap for error handling here.
pb-cli = { workspace = true }
winit = "0.30"
# Native file/folder picker (Open dialog); uses the OS dialog on Windows. Default
# features pull the Linux xdg-portal/zbus backend we don't need, so disable them —
# the Windows (and later macOS) native backend is always compiled.
rfd = { version = "0.14", default-features = false }
# Native OS menu bar (real Windows HMENU now, NSMenu on macOS later from the same
# API). Shown in windowed mode only — fullscreen stays chrome-free. OS-drawn, so
# it's perf-neutral. On Linux it would need the optional `gtk` feature (off here).
muda = "0.19"
# egui for our own dialog windows (Settings, About): a second winit window with an
# egui-wgpu surface. egui 0.29 matches wgpu 22 + winit 0.30. Only runs while a
# dialog is open (off the photo hot path); follows the OS dark/light theme.
egui = "0.29"
egui-wgpu = "0.29"
# Default features give clipboard + `links` (so the About hyperlink opens a browser);
# the Linux wayland/x11 backends are cfg-gated out on Windows.
egui-winit = "0.29"
# Block on wgpu adapter/device init for the dialog window's own GPU surface.
pollster = "0.3"
# Pack/unpack the f16 (Rgba16Float) HDR decode buffer when converting to 8-bit for
# the clipboard. Matches the version pb-decode already resolves.
half = "2"
# Rasterize the vendored Font Awesome duotone SVG icons for the HUD/toast overlays
# (re-exports usvg + tiny_skia). Same version + default-features-off as pb-decode's
# SVG backend, so it's already in the lockfile. Runs only when an overlay is rebuilt
# (off the photo hot path).
resvg = { version = "0.47", default-features = false }
# Parse + write the config files: the optional keymap.toml (task #8) and the typed
# settings.toml (task #20/#22). Read on the view path is privacy-safe (task #2);
# writes happen only on an explicit user action (Save / fullscreen toggle).
# `default-features = false` drops the datetime/preserve-order extras we don't use.
toml = { version = "0.8", default-features = false, features = ["parse", "display"] }
# Derive (de)serialization for the typed Settings model (settings.toml).
serde = { version = "1", features = ["derive"] }
# Cross-platform **text** clipboard for Copy File Path (Shift+Ctrl+C / ⇧⌘C) on every
# platform. Copy **Image** uses Windows' richer native path in `clipboard.rs` (Win32
# CF_DIBV5 + CF_HDROP), so only Linux falls back to arboard's `image-data` (enabled
# per-target below). `default-features = false` drops the Linux wayland backend we don't
# need. (macOS ships the SwiftUI host, which owns the clipboard natively.)
arboard = { version = "3", default-features = false }
# Iterative, symlink-safe directory walk for the recursive folder scan. The old hand-
# rolled recursion overflowed the stack on a deeply nested tree and could loop forever on
# a directory symlink/alias cycle (the kind that riddles macOS's ~/Library) — both crashes.
# walkdir iterates (no stack growth with depth), doesn't follow symlinks by default (no
# cycles), and bounds open dir handles. Already in the lockfile (transitive), so it's free.
walkdir = "2"

# Linux Live Photo audio output (`--features livephoto`): `live_audio.rs` pipes the
# FFmpeg-decoded PCM (pb-decode's `decode_motion_audio`) to PipeWire's `pw-cat`, and uses
# libc only to SIGSTOP/SIGCONT that child for pause/resume. We deliberately do NOT use
# cpal/rodio: cpal's ALSA path on a PipeWire desktop advertises `buffer_size min: 1` and
# underruns nondeterministically (clicks); piping straight to PipeWire plays clean.
# Windows/macOS play audio through their native media players, so only Linux uses this.
libc = { version = "0.2", optional = true }

# Linux Copy Image: enable arboard's image clipboard (Wayland/X11). Windows and macOS use
# their own native paths in clipboard.rs, so only Linux needs this.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
arboard = { version = "3", default-features = false, features = ["image-data"] }
# rfd needs an explicit backend on Linux (Windows/macOS always compile their native one, so the
# base `default-features = false` above is enough there). Use the GTK3 backend: it shows a real
# file dialog under X11/Wayland — including WSLg — without requiring a running xdg-desktop-portal
# service (which the `xdg-portal` backend would). The GTK dev libs are already in the tree via the
# menu/trash path. Both declarations keep `default-features = false`, so Linux gets *only* gtk3.
rfd = { version = "0.14", default-features = false, features = ["gtk3"] }

# Linux in-app AppImage auto-update (src/update.rs `linux`): a JSON-feed self-replace updater.
# `ureq` (rustls — no OpenSSL) polls latest.json + streams the newer AppImage down; `sha2` verifies
# it before the on-quit `$APPIMAGE` swap. `ureq` already resolves in the lockfile via pb-app-core,
# so this adds ~no build cost; both stay off the Windows/macOS builds (those use Velopack/Sparkle).
[target.'cfg(target_os = "linux")'.dependencies]
ureq = { version = "3", features = ["json"] }
sha2 = "0.10"

# Win32 for: pointing the window icon at the exe's multi-size .ico (crisp small
# title-bar icon, vs winit downscaling one big image), and the native menu later.
[target.'cfg(windows)'.dependencies]
# Velopack: per-user Windows installer + built-in auto-update (ships on the winit shell).
# `velopack_startup()` runs first in main() (handles the --veloapp-* lifecycle args; a no-op off
# a Velopack install), and a background thread checks the feed via `UpdateManager`/`HttpSource`.
# Windows-only: macOS ships a notarized DMG and Linux has no updater, so gating it here keeps
# velopack — and the OpenSSL its `native-tls`/`ureq` chain drags in — out of every non-Windows
# build (see src/update.rs, which stubs these calls off Windows).
velopack = "0.0.70"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    # AttachConsole + std-handle rebind so clap --help/--version/errors are visible from a
    # GUI-subsystem release build (task #78, src/win_console.rs).
    "Win32_System_Console",
    # uxtheme.dll dark-mode exports (resolved by ordinal) for the native menu.
    "Win32_System_LibraryLoader",
    # TaskDialog (the native "About" dialog).
    "Win32_UI_Controls",
    # Clipboard copy (Ctrl+C): open/empty/set, HGLOBAL alloc, CF_DIBV5/CF_HDROP,
    # BITMAPV5HEADER. CF_* live under System_Ole; the bitmap header under Graphics_Gdi.
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_Graphics_Gdi",
    # GlobalMemoryStatusEx / MEMORYSTATUSEX: query available physical RAM for the
    # eager-archive (7z) memory budget (see src/archive.rs).
    "Win32_System_SystemInformation",
    # WinRT MediaPlayer for Live Photo audio (task #39, src/live_audio.rs):
    # Media.Playback.MediaPlayer + Media.Core.MediaSource + Foundation.Uri/TimeSpan.
    "Foundation",
    "Media_Core",
    "Media_Playback",
    # IVectorView over the playback item's track lists — deselecting the video track
    # on the video-audio player so it never double-decodes the picture (task #79).
    "Foundation_Collections",
    # Archive video audio: CreateRandomAccessStreamOverStream wraps the entry's
    # in-RAM IStream (pb_decode::mem_istream) into the IRandomAccessStream the
    # WinRT MediaPlayer's MediaSource::CreateFromStream takes.
    "Win32_System_WinRT",
    "Storage_Streams",
    # RegisteredApplications/Capabilities self-registration so "Set default…" can
    # deep-link PhotoBlaze's own Default-apps page (task #14, src/default_app.rs).
    # Win32_Security: RegCreateKeyExW's SECURITY_ATTRIBUTES parameter lives there.
    "Win32_System_Registry",
    "Win32_Security",
    # UISettings.GetColorValue(Accent): the user's Windows accent color, for the
    # System accent-source option (src/accent.rs). UIColorType + Color live under UI.
    "UI",
    "UI_ViewManagement",
    # WASAPI video-audio render engine (src/wasapi_audio.rs, task #79): the MF Source
    # Reader decodes any audio (incl. legacy MJPEG-AVI/PCM the WinRT MediaPlayer won't
    # play) → shared-mode event-driven WASAPI. Audio = IMMDeviceEnumerator/IAudioClient/
    # IAudioRenderClient/IAudioClock + WAVEFORMATEX(TENSIBLE) (Audio_Apo). Threading =
    # the render event handle (WaitForSingleObject); Kernel for the KSDATAFORMAT GUIDs.
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_System_Threading",
] }

# Test-only: build archive fixtures for the no-trace integration tests. Same crates
# pb-source uses; their writers come with the base crates (pure Rust).
[dev-dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
sevenz-rust2 = "0.21.3"
# Build tiny tar / tar.gz fixtures for the no-trace tests (#102). Same versions
# pb-source already links, so the lockfile is unchanged.
tar = { version = "0.4.46", default-features = false }
flate2 = "1"
# Parse a sample latest.json in the update-feed unit tests, so the manifest struct stays in sync
# with what scripts/release-linux-upload.sh writes. Already in the lockfile (via ureq/pb-app-core).
serde_json = "1"

# Embeds the .exe icon + version metadata on Windows (build.rs). Best-effort: if
# the resource compiler is absent the build still succeeds (see build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
