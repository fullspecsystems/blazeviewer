[package]
name = "pb-mac-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "macOS Swift/AppKit FFI bridge for PhotoBlaze (NS1, ADR-021): a swift-bridge staticlib exposing the platform-neutral AppCore to a SwiftUI host. macOS-only; empty on other targets."

# `staticlib` = the archive the Swift host links into the .app; `rlib` = so `cargo test`
# can build a test harness against the bridge on macOS.
[lib]
crate-type = ["staticlib", "rlib"]

# Packages the built staticlib + the generated glue into the xcframework-backed local
# Swift package (`PbMacFfi/`) that the `mac/` SwiftPM host consumes. A `[[bin]]` (not a
# build.rs step) because it needs the *built* `.a`; driven by scripts/build-swift-host.sh.
[[bin]]
name = "create-package"
path = "src/bin/create_package.rs"
required-features = ["package"]

[features]
# Enables the `create-package` bin (pulls swift-bridge-build in as a regular dependency).
package = ["dep:swift-bridge-build"]

[dependencies]
pb-app-core = { workspace = true }
# The concrete wgpu presenter (the CAMetalLayer surface constructor) + the launch-input
# policy (pb-core::open, ADR-019) + the worker progress handles (pb-source) — the same
# platform-neutral crates the winit shell composes; needed here to build the shell's Rust
# half for the Swift host.
pb-render = { workspace = true }
pb-core = { workspace = true }
pb-source = { workspace = true }

# swift-bridge is macOS-target-only: on a Windows/Linux target the whole `ffi` module is
# `cfg`'d out (see lib.rs), so the crate builds to an empty staticlib and never pulls the
# swift-bridge graph. Keeps the existing `--workspace` CI on Windows/Linux untouched.
[target.'cfg(target_os = "macos")'.dependencies]
# The shared CLI parser (task #78): the Swift host feeds ProcessInfo.arguments through
# the SAME clap surface the winit shell uses — one source of truth for the flags.
# macOS-target-only like swift-bridge (it's only used inside the cfg'd ffi module).
pb-cli = { workspace = true }
swift-bridge = "0.1"
swift-bridge-build = { version = "0.1", optional = true }

[target.'cfg(target_os = "macos")'.build-dependencies]
swift-bridge-build = "0.1"
