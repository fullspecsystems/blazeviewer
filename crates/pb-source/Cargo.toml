[package]
name = "pb-source"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Photo source abstraction for Blaze Viewer: a uniform 'encoded bytes + identity for item i' over a filesystem listing, a ZIP archive, a 7-Zip archive, or a tar-family archive (tar / tar.gz / tar.bz2 / tar.zst / tar.xz). RAM-only, read-only on the view path (honors the no-trace privacy guarantee)."

[dependencies]
# ZIP archive reading. Lean, pure-Rust feature set: `deflate` (miniz_oxide — the
# only common photo-zip codec besides stored) + `aes-crypto` (pure-Rust AES for
# WinZip-AES-encrypted archives). bzip2/zstd are intentionally omitted: they're
# rare for already-compressed photos and would pull C build deps — exactly the
# Windows build-risk the project avoids (see the libheif notes in CLAUDE.md).
zip = { version = "2", default-features = false, features = ["deflate", "aes-crypto"] }
# 7-Zip reading (SevenZSource's eager decode-to-RAM). Pure Rust including its codecs
# (LZMA/LZMA2 via lzma-rust2, bzip2 via libbz2-rs-sys, PPMd via ppmd-rust), so no C
# build risk. Default features kept (compress + aes256 + bzip2 + ppmd + util) for
# codec coverage; all pure Rust.
sevenz-rust2 = "0.21.3"
# Tar-family reading (task #102): TarSource's lazy index over plain .tar (headers
# only, seeking over file data) and the eager streaming pass over compressed
# tarballs. Read-side handles PAX/GNU long names. `default-features = false` drops
# the unix-only xattr support we never read.
tar = { version = "0.4.46", default-features = false }
# The tarball codecs — all pure Rust, matching the zip/7z picks above (no C build
# risk, no LGPL exposure; see the #102 plan's crate table):
#  * gzip: flate2's default rust backend is miniz_oxide (already in-tree via zip).
#    `MultiGzDecoder` so concatenated members (pigz output) decode whole.
#  * bzip2: the default backend is libbz2-rs-sys (already in-tree via sevenz-rust2).
#    `MultiBzDecoder` for concatenated streams (pbzip2 output).
#  * zstd: ruzstd (decode used at runtime; its encoder generates test fixtures).
#    The C `zstd` crate is faster but is exactly the build risk this crate avoids;
#    the reader-factory seam in tar.rs makes an A/B swap a one-line change.
#  * xz: lzma-rust2 (already in-tree via sevenz-rust2) exposes a pure-Rust
#    XzReader, which is what puts .tar.xz in scope at zero new dependencies.
flate2 = "1"
bzip2 = "0.6"
ruzstd = "0.8"
lzma-rust2 = { version = "0.16", default-features = false, features = ["std", "xz", "optimization"] }
# RAR5 + RAR4 decode: pure-Rust, MIT, clean-room, decode-only. The container
# parsers are OURS (src/rar.rs = RAR5, src/rar4.rs = RAR4); compcol supplies only
# the codec.
#
# Pinned to the `rar3-standard-filters` branch tip. Beyond the `5c47b0e` rev we
# shipped RAR5 on, this rev adds:
#   * the RAR3/RAR4 codec (LZ+Huffman, PPMd-II variant H, in-band Delta/x86
#     filters, solid multi-member) — what unblocks RAR4 viewing, and
#   * the RAR5 Delta filter + `Decoder::add_file_boundary` (so RAR5 Delta and
#     x86-in-solid members now decode instead of degrading; see decode_solid_group).
# This branch is still under review upstream; swap to an exact crates.io pin
# (`compcol = "=x.y.z"`) once it merges + releases. Exact-pin either way — single
# vendor, review the diff on every bump (zero-dep + forbid(unsafe) keeps that tractable).
compcol = { git = "https://github.com/jdlien/compcol", rev = "da98ff60899065d4005d4e137b5a556d04299731", default-features = false, features = ["std", "rar5", "rar3"] }
# CRC32 of decoded RAR entries against the header CRC (neither compcol nor the
# fstool reference verify it — silent garbage on corruption otherwise).
# Already in-tree via flate2.
crc32fast = "1"
# RAR5 encryption (task #103): password-protected entries decrypt with standard
# primitives — PBKDF2-HMAC-SHA256 key derivation (2^N iterations) + AES-256-CBC
# over the packed runs — unlike RAR4's bespoke KDF (out of scope). All pure Rust
# and all already in-tree (aes/cbc via sevenz-rust2's AES256; hmac/sha2 via the
# 7z + zip crypto), so no new build risk. See src/rar_crypt.rs.
aes = "0.9"
cbc = "0.2"
hmac = "0.12"
sha2 = "0.10"

[dev-dependencies]
# Fixture generation only: XzWriter needs the encoder feature (test builds unify
# it in; ship builds stay decode-only).
lzma-rust2 = { version = "0.16", default-features = false, features = ["std", "xz", "optimization", "encoder"] }

[features]
# Expose raw-byte open entry points for the cargo-fuzz harness (fuzz/) — the
# project rule is "fuzz the decoders", and archive parsers eat hostile bytes.
# Never enabled in a ship build.
fuzz-internals = []
