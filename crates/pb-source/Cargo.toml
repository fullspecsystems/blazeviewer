[package]
name = "pb-source"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Photo source abstraction for PhotoBlaze: a uniform 'encoded bytes + identity for item i' over a filesystem listing, a ZIP archive, or a 7-Zip archive. RAM-only, read-only on the view path (honors the no-trace privacy guarantee)."

[dependencies]
# ZIP archive reading. Lean, pure-Rust feature set: `deflate` (miniz_oxide — the
# only common photo-zip codec besides stored) + `aes-crypto` (pure-Rust AES for
# WinZip-AES-encrypted archives). bzip2/zstd are intentionally omitted: they're
# rare for already-compressed photos and would pull C build deps — exactly the
# Windows build-risk the project avoids (see the libheif notes in CLAUDE.md).
zip = { version = "2", default-features = false, features = ["deflate", "aes-crypto"] }
# 7-Zip reading (SevenZSource's eager decode-to-RAM). Pure Rust including its codecs
# (LZMA/LZMA2 via lzma-rust2, bzip2 via libbz2-rs-sys, PPMd via ppmd-rust), so no C
# build risk. Default features kept (compress + aes256 + bzip2 + ppmd + util) for
# codec coverage; all pure Rust.
sevenz-rust2 = "0.21.3"
