[package]
name = "pb-mesh"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Blaze Viewer's 3D models (task #151): STL / OBJ / 3MF parsed from bytes into one canonical mesh, auto-framed, and rendered to a still on the CPU. Pure: no I/O, no GPU."

[dependencies]
# 3MF is an OPC package (a ZIP). Deliberately the current major, not the 2.x pb-source still
# uses: zip 2.x trusts a ZIP64 extra field's offsets even when the regular 32-bit header is
# valid (the spec says the ZIP64 value applies only to fields set to 0xFFFFFFFF), and Bambu
# Studio writes 3MFs whose ZIP64 extras carry a wrong local-header offset. 2.x then rejects the
# whole package as "Could not find EOCD"; >= 4 reads it, as `unzip` does. Inflate only: no
# encoders, and no AES (a 3MF never needs it). #155 moves pb-source to this major too.
zip = { version = "9.8", default-features = false, features = ["deflate-flate2"] }
# Backend selection only: zip 9 takes flate2 with default features off, so something must pick
# an inflate backend. This picks flate2's default (miniz_oxide), already in the tree via
# pb-decode, rather than zip's `deflate` bundle, which would also pull the zopfli encoder and
# switch flate2 to zlib-rs graph-wide.
flate2 = "1"
# 3MF's model XML. Must be >= 0.41: older releases carry RUSTSEC-2026-0194/0195 (DoS on
# hostile attribute and namespace lists), and a 3MF is hostile input.
quick-xml = "0.42"
# OBJ: fuzzed upstream, handles the format's many dialect quirks. Default features off
# (no ahash); materials are not loaded yet (the sibling-file seam is task #154).
tobj = { version = "4", default-features = false }

[dev-dependencies]
proptest = "1"
