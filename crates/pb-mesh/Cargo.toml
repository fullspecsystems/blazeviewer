[package]
name = "pb-mesh"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Blaze Viewer's 3D models (task #151): STL / OBJ / 3MF parsed from bytes into one canonical mesh, auto-framed, and rendered to a still on the CPU. Pure: no I/O, no GPU."

[dependencies]
# 3MF is an OPC package (a ZIP). Same major version pb-source uses (task #155 tracks the
# bump to >= 9 for the AES advisory; 3MF never needs AES, so the feature stays off here).
zip = { version = "2", default-features = false, features = ["deflate"] }
# 3MF's model XML. Must be >= 0.41: older releases carry RUSTSEC-2026-0194/0195 (DoS on
# hostile attribute and namespace lists), and a 3MF is hostile input.
quick-xml = "0.42"
# OBJ: fuzzed upstream, handles the format's many dialect quirks. Default features off
# (no ahash); materials are not loaded yet (the sibling-file seam is task #154).
tobj = { version = "4", default-features = false }

[dev-dependencies]
proptest = "1"
