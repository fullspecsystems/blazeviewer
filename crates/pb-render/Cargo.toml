[package]
name = "pb-render"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "GPU presentation for PhotoBlaze (wgpu) plus fit-to-screen geometry."

# wgpu is the v1 renderer (DX12 backend on Windows). The headless render path
# backs the golden-image tests; the surface path drives the on-screen window.
[dependencies]
wgpu = "22"
bytemuck = { version = "1", features = ["derive"] }
half = "2"
pollster = "0.3"

# Query the display's HDR/wide-gamut state via DXGI (`display::primary_hdr`) to
# choose the output path: an fp16 scRGB surface (wide gamut + HDR) vs SDR 8-bit.
[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
] }

# macOS EDR / P3 detection (`display::primary_hdr`) via NSScreen, and the EDR
# CAMetalLayer surface poke. Raw `msg_send!` (no objc2-app-kit) keeps the surface
# minimal and version-robust. objc2 0.6 is already in the tree (muda/winit).
[target."cfg(target_os = \"macos\")".dependencies]
objc2 = "0.6"

[dev-dependencies]
