[package]
name = "pb-app-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Platform-neutral orchestration model for PhotoBlaze: actions, the physical-key model, and the keymap — no winit/egui/Swift, so every shell (winit on Windows, AppKit on macOS) drives the same core (NS0/ADR-021)."

# Deliberately shell-free: no winit/egui/wgpu. Config I/O (the keymap loader and
# the per-user config dir) is allowed here — that is platform code, not *shell*
# code — but UI toolkits never are. This is the crate the macOS Swift bridge links.
[dependencies]
# Keymap + settings config parse/format (keymap.toml / settings.toml). Same version +
# features as pb-app so the lockfile is unchanged by the split.
toml = { version = "0.8", default-features = false, features = ["parse", "display"] }
# Typed (de)serialization for the persisted Settings model (NS0 5.5 / Phase 0.5).
serde = { version = "1", features = ["derive"] }
# fp16 → sRGB8 conversion for the clipboard copy prep (`engine::to_clipboard_rgba8`),
# migrated with `copy_image` off the winit shell (NS0 5.5 / Phase B). Same pin as pb-decode.
half = "2"
# Engine crates the orchestration state (`AppCore`) references as step 5 relocates it
# off the winit shell: the view transform + rotation (pb-render), the decode-to-fit box
# (pb-decode), the pure nav / residency mirror (pb-core), and the PhotoSource seam +
# decode pool (pb-source). Still no winit/egui/Swift here; pb-render pulls wgpu
# transitively, which is expected — the `AppCore` the macOS Swift bridge links owns the
# renderer + decode engine.
pb-core = { workspace = true }
pb-render = { workspace = true }
pb-decode = { workspace = true }
pb-source = { workspace = true }
# The HUD CPU compositor — AppCore owns `hud: Option<Hud>` so it drives the overlay
# render path. Shell-neutral pure compute (fontdue + resvg), no UI toolkit, so the
# "no winit/egui" invariant holds.
pb-hud = { workspace = true }
# EXIF Orientation read/write for the save-rotation / undo commands (NS0 5.6 — moved off the
# shell so those flow actions are pure core arms). Pure Rust, no C build risk.
little_exif = "0.6"
# Send a deleted photo to the OS Recycle Bin / Trash on the Delete command (NS0 5.6 — the
# delete op moved off the shell so it's a core arm). Cross-platform; the delete runs on the
# host's main thread (STA on Windows for OLE), so `coinit_apartmentthreaded` matches.
trash = { version = "5", default-features = false, features = [
    "coinit_apartmentthreaded",
] }
# Iterative, symlink-safe directory walk for the scan resolvers migrated off the shell (NS0 5.6
# Step 2b). Same crate the shell used; already in the lockfile.
walkdir = "2"
# QR-code payload decode for "text in image" (task #45) — pure Rust (no OS barcode API on
# Windows; one shared backend on every platform, testable with generated QR bitmaps).
rqrr = "0.10"
# AI image-description local-endpoint backend (task #44, subtask 4): a blocking POST to an
# OpenAI-compatible /v1/chat/completions on a worker thread (decode-pool discipline — never
# tokio, never the event loop). `json` pulls serde_json integration; TLS ships by default so
# a user-configured https endpoint works, though the LM Studio / Ollama default is localhost
# http. The request/response building + parsing are pure fns (unit-tested without live HTTP).
ureq = { version = "3", features = ["json"] }
serde_json = "1"
# base64 the JPEG-encoded, downscaled image into the endpoint's data URI (already in the lock).
base64 = "0.22"

[features]
# Linux Live Photo motion + audio: forwards to pb-decode's FFmpeg backend and flips on the
# Linux motion-decode + pairing paths in engine.rs / app_core_impl.rs. Off by default (macOS
# and Windows have their own backends, always on). See pb-decode's `livephoto` feature.
livephoto = ["pb-decode/livephoto"]

[dev-dependencies]
# Generate QR bitmaps for the image_text decode tests (never shipped). Default features
# pull the `image` crate; we only need the raw module colors.
qrcode = { version = "0.14", default-features = false }

# Physical-RAM query for the 7z eager-decompress pre-flight (archive.rs), migrated off the shell
# (NS0 5.6 Step 2c). Platform syscalls isolated in that one module; already in the workspace lock.
# The WinRT features (Media_Ocr + SoftwareBitmap plumbing) drive the on-device OCR backend
# (image_text.rs, task #45) — the same OS-codec posture as WIC: no model shipped, no network.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_Com",
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Security_Cryptography",
] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
# On-device OCR via Apple **Vision** (task #45.2) — the macOS twin of the Windows.Media.Ocr
# backend (image_text.rs). Typed `objc2` bindings, the same OS-codec posture as the `windows`
# crate above: no model shipped, no network, fully on-device. `VNRecognizeTextRequest` runs
# over a `CGImage` built from the displayed pixels; `performRequests:` blocks on the scan
# worker thread (never the event loop). `default-features = false` because every objc2
# framework crate's default set enables its ENTIRE API surface (62 Vision requests, all of
# Foundation, all of CoreGraphics) — we opt into just the handful of gated types we touch.
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-vision = { version = "0.3", default-features = false, features = [
    "std",
    "VNRequest",
    "VNRequestHandler",
    "VNRecognizeTextRequest",
    "VNObservation",
    "objc2-core-graphics",
    # Gates `VNDetectedObjectObservation::boundingBox` (a `CGRect`), which we read per line to
    # group the recognized lines into paragraphs (image_text::group_paragraphs).
    "objc2-core-foundation",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSString",
    "NSDictionary",
    "NSEnumerator",
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std",
    "CGImage",
    "CGColorSpace",
    "CGDataProvider",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "CFBase",
    "CFData",
] }
