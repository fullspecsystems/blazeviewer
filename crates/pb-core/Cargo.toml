[package]
name = "pb-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Pure navigation, prefetch, and cache-residency logic for PhotoBlaze (no I/O, no GPU)."

# Intentionally ZERO runtime dependencies. Everything here is deterministic,
# dependency-free, and unit-testable, which keeps coverage high and lets us
# swap policies behind traits without ever touching the rendering hot path.
[dependencies]

[dev-dependencies]
# Property-based invariants for nav/cache policies (the CLAUDE.md TDD mandate);
# first consumer: the thumbnail-cache budget/pinning invariants (task #83).
proptest = "1"
