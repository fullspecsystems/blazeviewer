# Lint + test on pushes to main, PRs, and on demand.
#
# Windows is the real target (winit, wgpu/DX12, WIC decode, the build.rs icon),
# so the full workspace builds and tests there. The pure `pb-core` crate is also
# checked on Linux — it has no I/O or GPU, matching the project's "gate the
# platform-independent logic on Linux" methodology (decisions.md ADR-010/011).
# The mac-swift lane (NS1, ADR-021) gates the SwiftUI host: the pb-mac-ffi
# bridge tests + the full build-swift-host.sh chain (cargo staticlib →
# swift-bridge package → swift build → .app). The egui-on-Mac beta needs no
# separate lane — the workspace it builds from is the same code the Windows
# job compiles, and release.yml builds the Mac DMG.
#
# ── Cost policy (2026-07-02, after burning ~2 000 billable min in a day) ──
# A full run ≈ 260 BILLABLE minutes (windows ~29 min × 2, macos ~20 min × 10,
# linux ~0.5 min × 1 — macOS is 78% of the bill), so CI does NOT run on every
# feature-branch push anymore:
#   • push: main only (the merge gate — this is where cross-platform breakage
#     must be caught; the Windows lane finds clippy errors invisible from macOS)
#   • pull_request: as before
#   • workflow_dispatch: on-demand for a branch you want checked BEFORE merging,
#     e.g.  gh workflow run ci --ref swiftui
# Docs-only changes (*.md, .taskmaster/) skip CI entirely; superseded runs on
# the same ref are cancelled; every job has a timeout so a hang can't burn the
# 6-hour default (a hung windows job alone would bill 720 min).

name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".taskmaster/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - ".taskmaster/**"
  workflow_dispatch:

# A newer push to the same ref supersedes the in-flight run (two pushes 30 s
# apart yesterday each billed a full ~260 min).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # Fixed vcpkg location so the libheif cache key, setup-libheif.ps1, and
      # pb-decode/build.rs all agree (build.rs reads VCPKG_ROOT).
      VCPKG_ROOT: C:\vcpkg-pb
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable + rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      # The `libheif` feature ships in the release MSI (tasks.json #16), so CI must
      # keep it compiling — it's cfg'd out of the default build and would otherwise
      # rot invisibly. Cache shared with release.yml (same key); only the first run
      # after a cache eviction pays the ~15 min vcpkg C build.
      - name: Cache libheif (vcpkg installed tree)
        id: libheif-cache
        uses: actions/cache@v4
        with:
          path: C:\vcpkg-pb\installed
          key: libheif-${{ runner.os }}-x64-windows-static-md-v1
      - name: Build libheif (vcpkg, cache miss only)
        if: steps.libheif-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: pwsh scripts/setup-libheif.ps1
      - name: Clippy with libheif (deny warnings)
        run: cargo clippy -p pb-decode -p pb-app --features libheif --all-targets -- -D warnings
      - name: Test with libheif
        run: cargo test -p pb-decode --features libheif

  core-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test pb-core (pure, platform-independent)
        run: cargo test -p pb-core

  # The NS1 SwiftUI host (arm64 runner = the aarch64-apple-darwin target the app ships).
  # Kept lean (macOS minutes are pricey): the FFI bridge tests + the whole host build
  # chain — which is also the only CI compile of the macOS-gated Rust (imageio, ffi, …).
  mac-swift:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test the FFI bridge (round-trip + the open flow, no GPU needed)
        run: cargo test -p pb-mac-ffi -p pb-app-core
      - name: Build the SwiftUI host (.app)
        run: ./scripts/build-swift-host.sh --debug
