# Build, sign, and publish the PhotoBlaze macOS release: a signed, notarized DMG attached
# to a GitHub Release.
#
# Windows is no longer built here — it ships via **Velopack** (per-user installer + auto-update),
# built + signed **locally** with scripts/release-windows.ps1 and uploaded to the
# downloads.fullspec.ca feed (GitHub Actions credits are finite; see CLAUDE.md → "Cutting a
# release"). This workflow now covers only macOS.
#
# Triggers on a version tag (e.g. `v0.1.0`): the macos-dmg job builds the .app, Developer ID
# codesigns it, packages + notarizes + staples a DMG, and the release job attaches it (plus a
# SHA256 sidecar) to a single GitHub Release with notes synthesized from the CHANGELOG. Also
# runnable manually (workflow_dispatch) to produce the DMG without a release.
#
# Signing uses Developer ID + notarization, gated on the secrets — an unset CSC_LINK still
# produces an (unsigned) DMG. See .taskmaster/docs/release-signing.md and
# scripts/setup-signing-secrets.sh.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create releases and upload assets

jobs:
  # macOS: build the SwiftUI-host .app (release-macos.sh's default since the 2026-07-02
  # cutover — cargo staticlib → swift build via build-swift-host.sh), Developer ID
  # codesign under the hardened runtime, package a DMG, notarize + staple, attach to the
  # Release. All the codesign/DMG/notarize logic lives in scripts/release-macos.sh so it
  # runs identically on a dev machine. Signing+notarization are gated on the secrets — an
  # unset CSC_LINK still produces an (unsigned) DMG (forks / early builds). Add these repo
  # secrets to enable it (same values you use elsewhere; see
  # .taskmaster/docs/release-signing.md, and scripts/setup-signing-secrets.sh to set them):
  #   CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
  macos-dmg:
    runs-on: macos-15 # arm64 (Apple Silicon); can host Xcode 26 for the .icon → Assets.car
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # The DMG is named from the crate version — a tag that disagrees would ship a
      # mislabeled file. Fail fast.
      - name: Check tag matches crate version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag_core="${GITHUB_REF_NAME#v}"; tag_core="${tag_core%%-*}"
          crate_ver="$(sed -n 's/^version = "\(.*\)"/\1/p' crates/pb-app/Cargo.toml | head -1)"
          if [ "$tag_core" != "$crate_ver" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (core $tag_core) != pb-app crate version $crate_ver"
            exit 1
          fi
          echo "Tag core matches crate version: $crate_ver"

      # No Xcode 26 / ImageMagick step: the icons (packaging/macos/{Assets.car,
      # PhotoBlaze.icns}) are prebuilt + committed (scripts/build-macos-icons.sh), so
      # build-swift-host.sh just copies them. The runner's default Xcode supplies swift,
      # codesign + notarytool, which is all the release script needs (the mac-swift CI
      # lane already proves the same build-swift-host.sh chain on macos-15).

      - name: Detect signing configuration
        run: |
          if [ -z "${{ secrets.CSC_LINK }}" ]; then
            echo "::warning::Apple Developer ID secrets not set — producing an UNSIGNED DMG."
          fi

      # bundle (.app) → codesign → DMG → notarize → staple → SHA256. One script, gated on
      # the secrets below (each stage skips cleanly when its inputs are absent).
      - name: Sign, package, notarize, staple (scripts/release-macos.sh)
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./scripts/release-macos.sh --release

      - name: Upload DMG as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: photoblaze-dmg
          path: |
            dist/*.dmg
            dist/*.dmg.sha256

  # Publish ONE GitHub Release with the macOS DMG and real notes synthesized from the
  # CHANGELOG (no duplicated GitHub auto-notes — see CLAUDE.md → "Cutting a release").
  # Runs only on a tag, after the build job has uploaded its artifact.
  release:
    needs: [macos-dmg]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # for CHANGELOG.md + scripts/changelog-section.sh

      - name: Download the DMG
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Release body = the CHANGELOG section for this version (fails loudly if it's missing,
      # so [Unreleased] must be rolled into the version before tagging). NOT
      # generate_release_notes — that appends GitHub's auto-notes. An agent can still curate
      # the body afterward with `gh release edit`.
      - name: Release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          bash scripts/changelog-section.sh "$version" > "$RUNNER_TEMP/notes.md"
          echo "----- release notes ($version) -----"
          cat "$RUNNER_TEMP/notes.md"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.dmg.sha256
          body_path: ${{ runner.temp }}/notes.md
          # SemVer pre-release tags (anything with a hyphen, e.g. v0.1.0-beta.1) publish as
          # a GitHub pre-release; clean tags (v0.1.0) are full releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
