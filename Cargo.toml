# PhotoBlaze — a photo viewer obsessed with display speed.
#
# Workspace layout encodes the architectural seams we want to A/B test:
#   pb-core    pure navigation/prefetch/cache logic — no I/O, no GPU, 100% testable
#   pb-decode  image-decode abstraction + swappable backends (decode-to-fit, preview-first)
#   pb-render  GPU presentation (wgpu) + fit-to-screen math
#   pb-app     the binary: winit event loop wiring everything together
#
# Heavy dependencies (wgpu, winit, zune-jpeg/turbojpeg, ...) are added per-crate as
# each roadmap phase lands.

[workspace]
resolver = "2"
members = [
    "crates/pb-core",
    "crates/pb-decode",
    "crates/pb-source",
    "crates/pb-render",
    "crates/pb-ui",
    "crates/pb-app",
]
# Throwaway measurement spikes have their own heavy deps; keep them out of the
# clean core workspace.
exclude = ["spikes"]

[workspace.package]
edition = "2021"
# Proprietary / closed-source: free to use, source not licensed. SPDX `LicenseRef-`
# marks a custom (non-OSI) license; the terms live in the root LICENSE file. Not
# published to crates.io (private), so this string is informational only.
license = "LicenseRef-Proprietary"
rust-version = "1.80"
repository = ""

[workspace.dependencies]
# Internal crates.
pb-core = { path = "crates/pb-core" }
pb-decode = { path = "crates/pb-decode" }
pb-source = { path = "crates/pb-source" }
pb-render = { path = "crates/pb-render" }
pb-ui = { path = "crates/pb-ui" }

# Release profile is tuned for the hot path: maximum optimization, fat-ish LTO,
# single codegen unit. `panic = "unwind"` (not abort) so the decode layer can
# `catch_unwind` a panicking third-party decoder and skip the bad file instead of
# killing the viewer — the GPU present hot path never panics, so the unwind-table
# cost doesn't touch it (see pb-decode `catch_panics`).
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "debuginfo"

# A profiling profile: release-grade codegen but keep debug symbols so Tracy /
# Superluminal can attribute time to source lines.
[profile.profiling]
inherits = "release"
strip = "none"
debug = "line-tables-only"
panic = "unwind"

[profile.bench]
lto = "thin"
codegen-units = 1
